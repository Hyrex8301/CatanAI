name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build CatanAI.sln -c Release   # dotnet test alone skips projects no test references (Catan.Sim)
      - run: dotnet test CatanAI.sln -c Release --no-build
      # Fuzz: fresh seeds every run so coverage grows over time. Any failure is saved as a replayable record.
      - name: Fuzz 2000 random games
        run: dotnet run -c Release --no-build --project src/Catan.Sim -- random --games 2000 --seed $(( ${{ github.run_number }} * 100000 )) --validate
      - name: Fuzz 500 pure-random games
        run: dotnet run -c Release --no-build --project src/Catan.Sim -- random --games 500 --seed $(( ${{ github.run_number }} * 100000 + 50000 )) --validate --pure
      - name: Fuzz 200 SmartBot games
        run: dotnet run -c Release --no-build --project src/Catan.Sim -- match --a smart-fast --b smart-fast --games 200 --seed $(( ${{ github.run_number }} * 1000 )) --validate
      - name: Upload failing games
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: failures/
          if-no-files-found: ignore
